<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISEE Practice</title>
<style>
  :root{
    --ink:#1A2B4A; --accent:#7A4A1F; --soft:#F3F0EA; --bg:#FBFAF7;
    --good:#1E7A4A; --bad:#A32B2B; --line:#DDD6C9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.65 Georgia,'Iowan Old Style',serif;}
  .wrap{max-width:820px;margin:0 auto;padding:24px 18px 80px}
  header{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:22px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:var(--accent);font-size:14px}
  h2{font-size:21px;margin:26px 0 6px}
  button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:6px;
    border:1px solid var(--ink);background:#fff;color:var(--ink);padding:9px 16px}
  button:hover{background:var(--soft)}
  button.primary{background:var(--ink);color:#fff}
  button.primary:hover{opacity:.88}
  button:disabled{opacity:.4;cursor:not-allowed}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;margin:12px 0}
  .card h3{margin:0 0 4px;font-size:18px}
  .meta{font-size:13px;color:#6B6355}
  .tag{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
    background:var(--soft);border:1px solid var(--line);border-radius:20px;
    padding:2px 9px;margin-right:6px;color:var(--accent);font-family:system-ui,sans-serif}
  .passage{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px}
  .passage p{margin:0 0 13px;position:relative;padding-left:34px}
  .ln{position:absolute;left:0;top:2px;font:11px/1 system-ui,sans-serif;color:#9A9284}
  .gist{background:var(--soft);border:1px solid var(--accent);border-radius:10px;
    padding:14px 16px;margin:18px 0}
  .gist textarea{width:100%;min-height:56px;font:15px/1.5 Georgia,serif;padding:9px;
    border:1px solid var(--line);border-radius:6px;resize:vertical}
  .q{border-top:1px solid var(--line);padding:16px 0}
  .q:first-of-type{border-top:none}
  .qtext{font-weight:bold;margin-bottom:9px}
  label.opt{display:block;padding:8px 11px;margin:5px 0;border:1px solid var(--line);
    border-radius:7px;cursor:pointer;background:#fff}
  label.opt:hover{background:var(--soft)}
  label.opt input{margin-right:9px}
  label.opt.correct{border-color:var(--good);background:#EEF7F1}
  label.opt.chosen-wrong{border-color:var(--bad);background:#FBEFEF}
  .exp{font-size:14.5px;background:var(--soft);border-left:3px solid var(--accent);
    padding:10px 13px;margin-top:9px;border-radius:0 6px 6px 0}
  .shape{font:11px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;
    color:var(--bad);border:1px solid var(--bad);border-radius:20px;padding:2px 7px;margin-right:6px}
  .bar{position:sticky;top:0;background:var(--bg);padding:9px 0;z-index:9;
    border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;
    font:14px system-ui,sans-serif;flex-wrap:wrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:bold}
  .over{color:var(--bad)}
  .score{font-size:30px;font-weight:bold}
  .hide{display:none}
  .note{font-size:14px;color:#6B6355;font-style:italic}
  ul.compact{margin:6px 0;padding-left:20px}

  ul.compact li{margin:3px 0}
  .btnrow{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
  .linkish{background:none;border:none;padding:0;color:var(--accent);
    text-decoration:underline;font-size:14px;cursor:pointer;font-family:inherit}

  /* The printable report. Hidden on screen; it exists only to become the PDF. */
  #report{display:none}
  .rmark{font:11px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;
    border-radius:20px;padding:2px 8px;margin-left:8px;white-space:nowrap}
  .rmark.ok{color:var(--good);border:1px solid var(--good)}
  .rmark.no{color:var(--bad);border:1px solid var(--bad)}
  .ritem{border-top:1px solid var(--line);padding:12px 0}

  @page{margin:14mm}
  @media print{
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    header, #app{display:none !important}
    #report{display:block !important}
    /* Keep a question and its explanation on one page. */
    .ritem{page-break-inside:avoid;break-inside:avoid}
    /* Browsers drop background fills when printing, so use rules instead. */
    #report .exp{background:none;border-left:3px solid var(--accent)}
    #report .gist{background:none;border:1px solid var(--line)}
  }
</style>
</head>

/* --- right-triangle diagram builder ---------------------------------- */
/* Always drawn with the right angle at the bottom-left. bl / tl / br are the
   vertex labels (blank for word problems). vertical / horizontal / hyp are the
   side labels; use "?" for the unknown side and it renders highlighted.      */
function triSVG(o){
  const BL=[70,170], TL=[70,55], BR=[290,170];
  const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];
  const unit=(p,q)=>{const dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy);return [dx/L,dy/L];};
  const acc='#7A4A1F', ink='#1A2B4A';
  const isQ=t=>String(t).indexOf('?')>=0;
  const sideCol=t=>isQ(t)?acc:ink;
  const sideW=t=>isQ(t)?3:2;

  // angle wedge at whichever vertex is marked
  const V = o.angleAt==='tl' ? TL : BR;
  const O1 = o.angleAt==='tl' ? BL : BL;
  const O2 = o.angleAt==='tl' ? BR : TL;
  const u1=unit(V,O1), u2=unit(V,O2);
  const R=30;
  const p1=[V[0]+u1[0]*R, V[1]+u1[1]*R];
  const p2=[V[0]+u2[0]*R, V[1]+u2[1]*R];
  let bx=u1[0]+u2[0], by=u1[1]+u2[1];
  const bl_=Math.hypot(bx,by)||1; bx/=bl_; by/=bl_;
  const ctrl=[V[0]+bx*R*1.14, V[1]+by*R*1.14];
  const atxt=[V[0]+bx*58, V[1]+by*58];

  const mV=mid(BL,TL), mH=mid(BL,BR), mHy=mid(TL,BR);

  return `<svg viewBox="0 0 360 215" width="100%" style="max-width:360px;display:block;margin:10px 0"
    xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif" font-size="15">
    <line x1="${BL[0]}" y1="${BL[1]}" x2="${TL[0]}" y2="${TL[1]}" stroke="${sideCol(o.vertical)}" stroke-width="${sideW(o.vertical)}"/>
    <line x1="${BL[0]}" y1="${BL[1]}" x2="${BR[0]}" y2="${BR[1]}" stroke="${sideCol(o.horizontal)}" stroke-width="${sideW(o.horizontal)}"/>
    <line x1="${TL[0]}" y1="${TL[1]}" x2="${BR[0]}" y2="${BR[1]}" stroke="${sideCol(o.hyp)}" stroke-width="${sideW(o.hyp)}"/>
    <path d="M ${BL[0]} ${BL[1]-17} L ${BL[0]+17} ${BL[1]-17} L ${BL[0]+17} ${BL[1]}" fill="none" stroke="${ink}" stroke-width="1.4"/>

/* ============================ STATE ============================ */
const app = document.getElementById('app');
let view = {name:'home'};
let timerId = null, elapsed = 0;

function save(k,v){ try{ localStorage.setItem('isee:'+k, JSON.stringify(v)); }catch(e){} }
function load(k,d){ try{ const v=localStorage.getItem('isee:'+k); return v?JSON.parse(v):d; }catch(e){ return d; } }

function fmt(s){ const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }

function startTimer(target){
  elapsed=0; clearInterval(timerId);
  timerId=setInterval(()=>{ elapsed++; const el=document.getElementById('timer');
    if(el){ el.textContent=fmt(elapsed); el.className='timer'+(elapsed>target?' over':''); } },1000);
}
function stopTimer(){ clearInterval(timerId); timerId=null; }

/* ============================ VIEWS ============================ */

function home(){
  stopTimer();
  const scores = load('scores',{});
  let h = `<p class="note">Read the passage, write the one-sentence gist, then answer. The gist is the whole point &mdash; when it is vague, the inference questions are the ones that fall.</p><h2>Reading</h2>`;
  PASSAGES.forEach(p=>{
    const s = scores[p.id];
    const inf = p.questions.filter(q=>q.t==="Inference").length;
    h += `<div class="card"><h3>${p.title}</h3>
      <div class="meta"><span class="tag">${p.genre}</span>${p.questions.length} questions &middot; ${inf} inference &middot; target ${fmt(p.target)}</div>
      <p class="meta" style="margin:8px 0">${s? 'Last score: <b>'+s.c+' / '+s.t+'</b> in '+fmt(s.time) : '&nbsp;'}</p>
      <button class="primary" onclick="go('passage','${p.id}')">${s?'Try again':'Start'}</button></div>`;
  });
  h += `<h2>Math</h2>`;
  MATHSETS.forEach(m=>{
    const ms = scores[m.id];
    h += `<div class="card"><h3>${m.title}</h3>
      <div class="meta"><span class="tag">${m.tag}</span>${m.questions.length} questions</div>
      <p class="meta" style="margin:8px 0">${ms? 'Last score: <b>'+ms.c+' / '+ms.t+'</b>' : '&nbsp;'}</p>
      <button class="primary" onclick="go('math','${m.id}')">${ms?'Try again':'Start'}</button></div>`;
  });
  h += `<p class="note" style="margin-top:26px">Read the explanation on every one you miss, not just the score.</p>`;
  app.innerHTML = h;
}

function passageView(id){
  const p = PASSAGES.find(x=>x.id===id);
  let h = `<div class="bar"><button onclick="go('home')">&larr; Back</button>
     <span>Target ${fmt(p.target)}</span><span class="timer" id="timer">0:00</span></div>
     <h2>${p.title}</h2><div class="meta" style="margin-bottom:10px"><span class="tag">${p.genre}</span></div>
     <div class="passage">`;
  p.paras.forEach(([n,t])=>{ h += `<p><span class="ln">${n}</span>${t}</p>`; });
  h += `</div>
    <div class="gist"><b>Before you look at a single question:</b><br>
    In one sentence, what is this passage about? If you cannot write it, reread.
    <textarea id="gistbox" placeholder="This passage is about..."></textarea>
    <button class="primary" style="margin-top:8px" onclick="unlock('${p.id}')">Lock it in &amp; show questions</button>
    <div id="gistwarn" class="note"></div></div>
    <div id="questions" class="hide"></div>`;
  app.innerHTML = h;
  startTimer(p.target);
}

window.unlock = function(id){
  const g = document.getElementById('gistbox').value.trim();
  if(g.split(/\s+/).filter(Boolean).length < 5){
    document.getElementById('gistwarn').innerHTML = 'Write a real sentence first &mdash; at least five words. This step is the practice.';
    return;
  }
  const p = PASSAGES.find(x=>x.id===id);
  let h = '<div class="card">';
  p.questions.forEach((q,i)=>{
    h += `<div class="q" id="q${i}"><div class="qtext">${i+1}. ${q.q}</div>
      <div class="meta" style="margin-bottom:6px"><span class="tag">${q.t}</span></div>`;
    q.o.forEach((o,j)=>{
      h += `<label class="opt" id="o${i}_${j}"><input type="radio" name="q${i}" value="${j}">${o}</label>`;
    });
    h += `<div class="exp hide" id="e${i}"></div></div>`;
  });
  h += `<button class="primary" style="margin-top:14px" onclick="grade('${id}')">Submit answers</button></div>`;
  const box = document.getElementById('questions');
  box.innerHTML = h; box.classList.remove('hide');
  box.scrollIntoView({behavior:'smooth'});
};

window.grade = function(id){
  stopTimer();
  const p = PASSAGES.find(x=>x.id===id);
  let c = 0;
  const items = [];
  p.questions.forEach((q,i)=>{
    const sel = document.querySelector(`input[name="q${i}"]:checked`);
    const pick = sel ? +sel.value : -1;
    if(pick === q.a) c++;
    document.getElementById(`o${i}_${q.a}`).classList.add('correct');
    if(pick !== -1 && pick !== q.a) document.getElementById(`o${i}_${pick}`).classList.add('chosen-wrong');
    const e = document.getElementById(`e${i}`);
    let shape = '';
    if(pick !== -1 && pick !== q.a && q.w && q.w[pick]){
      const s = SHAPES[q.w[pick]];
      shape = `<span class="shape">${s[0]}</span> ${s[1]}<br><br>`;
    }
    e.innerHTML = shape + q.e; e.classList.remove('hide');
    document.querySelectorAll(`input[name="q${i}"]`).forEach(r=>r.disabled=true);

    items.push({n:i+1, q:q.q, ok:pick===q.a, e:shape + q.e,
      picked: pick===-1 ? '(no answer)' : q.o[pick], correct: q.o[q.a]});
  });
  const infTot = p.questions.filter(q=>q.t==="Inference").length;
  let infC = 0;
  p.questions.forEach((q,i)=>{ if(q.t==="Inference"){ const s=document.querySelector(`input[name="q${i}"]:checked`); if(s && +s.value===q.a) infC++; } });

  const scores = load('scores',{}); scores[id]={c:c,t:p.questions.length,time:elapsed}; save('scores',scores);
  const yours = document.getElementById('gistbox').value.trim();

  buildReport({title:p.title, c:c, t:p.questions.length, time:elapsed, target:p.target,
    inf:`${infC} / ${infTot}`, gist:{yours:yours, good:p.gist}, items:items});

  const banner = document.createElement('div');
  banner.className='card';
  banner.innerHTML = `<div class="score">${c} / ${p.questions.length}</div>
    <div class="meta">Inference: <b>${infC} / ${infTot}</b> &middot; Time ${fmt(elapsed)} (target ${fmt(p.target)})</div>
    <div style="margin-top:14px"><b>Your gist:</b><br><i>${yours.replace(/</g,'&lt;')}</i></div>
    <div style="margin-top:10px"><b>A good gist:</b><br><i>${p.gist}</i></div>
    <div class="exp" style="margin-top:14px">${c < p.questions.length-1
      ? 'Compare the two sentences above. When a passage goes badly, the gist is almost always the thing that was vague &mdash; and inference questions are the first to fall, because they are the only ones you cannot answer by looking something up.'
      : 'Well done. Notice how much of that came from having the passage clear before the first question.'}</div>
    ${resultButtons()}`;
  document.getElementById('questions').prepend(banner);
  banner.scrollIntoView({behavior:'smooth'});
};

function mathView(id){
  const m = MATHSETS.find(x=>x.id===id);
  window.__MSET = m;
  let h = `<div class="bar"><button onclick="go('home')">&larr; Back</button><span class="timer" id="timer">0:00</span></div>
    <h2>${m.title}</h2><div class="exp">${m.intro}</div><div class="card">`;
  m.questions.forEach((q,i)=>{
    h += `<div class="q"><div class="qtext">${i+1}. ${q.q}</div>`;
    if(q.svg) h += triSVG(q.svg);
    q.o.forEach((o,j)=>{ h += `<label class="opt" id="mo${i}_${j}"><input type="radio" name="m${i}" value="${j}">${o}</label>`; });
    h += `<div class="exp hide" id="me${i}"></div></div>`;
  });
  h += `<button class="primary" style="margin-top:14px" onclick="gradeMath()">Submit answers</button></div>`;
  app.innerHTML = h;
  startTimer(m.target);
}

      : 'If any went wrong, check the two rules: terms combine only when every exponent matches, and a variable missing from one term cannot appear in the GCF.');
  b.innerHTML=`<div class="score">${c} / ${M.questions.length}</div>
    <div class="meta">Time ${fmt(elapsed)}</div>
    <div class="exp" style="margin-top:12px">${tip}</div>
    ${resultButtons()}`;
  app.querySelector('.card').prepend(b);
  b.scrollIntoView({behavior:'smooth'});
};

/* ==================== REPORT / PDF / EMAIL ==================== */
/* buildReport() fills #report, which is invisible on screen and is the only
   thing that prints. "Save as PDF" is just window.print() — Safari's print
   dialog offers Save as PDF, and on iOS the share sheet hands that PDF to
   Mail as an attachment. No library, no server. */

let REPORT = null;

function plain(html){
  const d = document.createElement('div');
  d.innerHTML = String(html==null?'':html);
  return (d.textContent||'').replace(/\s+/g,' ').trim();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function buildReport(r){
  REPORT = r;
  const when = new Date().toLocaleDateString(undefined,
    {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  let h = `<div style="border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:16px">
      <h1 style="margin:0 0 4px">ISEE Practice &mdash; Results</h1>
      <div class="sub">${esc(r.title)} &middot; ${when}</div>
    </div>
    <div class="score">${r.c} / ${r.t}</div>
    <div class="meta">Time ${fmt(r.time)}${r.target? ' (target '+fmt(r.target)+')':''}${
      r.inf? ' &middot; Inference '+r.inf : ''}</div>`;
  if(r.gist){
    h += `<div class="gist" style="margin-top:14px"><b>Gist written:</b><br>
      <i>${esc(r.gist.yours) || '(left blank)'}</i>
      <div style="margin-top:8px"><b>A good gist:</b><br><i>${r.gist.good}</i></div></div>`;
  }
  r.items.forEach(it=>{
    h += `<div class="ritem">
      <div class="qtext">${it.n}. ${it.q}<span class="rmark ${it.ok?'ok':'no'}">${it.ok?'correct':'missed'}</span></div>
      ${it.svg||''}
      <div class="meta" style="margin:6px 0">Answer given: <b>${it.picked}</b>${
        it.ok? '' : ' &middot; Correct: <b>'+it.correct+'</b>'}</div>
      <div class="exp">${it.e}</div></div>`;
  });
  document.getElementById('report').innerHTML = h;
}

/* Recipient lives in localStorage, not in the source, so this public repo
   does not publish an email address. Asked once per device. */
function recipient(force){
  let to = load('mailto','');
  if(force || !to){
    to = (prompt('Email results to which address?', to||'')||'').trim();
    if(!to) return '';
    save('mailto', to);
  }
  return to;
}
window.changeMail = function(){ if(recipient(true)) emailReport(); };

window.emailReport = function(){
  const r = REPORT; if(!r) return;
  const to = recipient(false); if(!to) return;
  const L = [`${plain(r.title)} — ${r.c} of ${r.t} correct, time ${fmt(r.time)}`];
  if(r.inf) L.push(`Inference: ${r.inf}`);
  if(r.gist) L.push('', 'Gist written: '+(r.gist.yours||'(left blank)'),
                        'A good gist: '+plain(r.gist.good));
  const missed = r.items.filter(i=>!i.ok);
  L.push('', missed.length ? `Missed ${missed.length}:` : 'Nothing missed.');
  /* Deliberately no explanations here — they are what make a mailto body
     overflow. The PDF is the full record; this is the scoreboard. */
  missed.forEach(it=>{
    const q = plain(it.q);
    L.push('', `${it.n}. ${q.length>90 ? q.slice(0,90)+'…' : q}`,
               `    chose: ${plain(it.picked)}`,
               `    correct: ${plain(it.correct)}`);
  });
  if(missed.length) L.push('', 'Full explanations and diagrams are in the PDF.');
  let body = L.join('\n');
  if(body.length > 4000) body = body.slice(0,4000) + '\n\n[…truncated — see the PDF]';
  location.href = 'mailto:' + encodeURIComponent(to)
    + '?subject=' + encodeURIComponent(`ISEE practice — ${plain(r.title)} — ${r.c}/${r.t}`)
    + '&body=' + encodeURIComponent(body);
};

function resultButtons(){
  return `<div class="btnrow">
      <button class="primary" onclick="go('home')">Back to list</button>
      <button onclick="window.print()">Save as PDF</button>
      <button onclick="emailReport()">Email results</button>
    </div>
    <p class="note" style="margin:9px 0 0">On iPhone: <b>Save as PDF</b>, then the share icon, then Mail &mdash; the PDF goes along as an attachment.
    <button class="linkish" onclick="changeMail()">Change email address</button></p>`;
}

window.go = function(name, id){
  window.scrollTo(0,0);
  if(name==='home') home();
  else if(name==='passage') passageView(id);
  else if(name==='math') mathView(id);
};

home();
</script>
