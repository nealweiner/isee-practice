<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISEE Practice</title>
<style>
  :root{
    --ink:#1A2B4A; --accent:#7A4A1F; --soft:#F3F0EA; --bg:#FBFAF7;
    --good:#1E7A4A; --bad:#A32B2B; --line:#DDD6C9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.65 Georgia,'Iowan Old Style',serif;}
  .wrap{max-width:820px;margin:0 auto;padding:24px 18px 80px}
  header{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:22px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:var(--accent);font-size:14px}
  h2{font-size:21px;margin:26px 0 6px}
  button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:6px;
    border:1px solid var(--ink);background:#fff;color:var(--ink);padding:9px 16px}
  button:hover{background:var(--soft)}
  button.primary{background:var(--ink);color:#fff}
  button.primary:hover{opacity:.88}
  button:disabled{opacity:.4;cursor:not-allowed}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;margin:12px 0}
  .card h3{margin:0 0 4px;font-size:18px}
  .meta{font-size:13px;color:#6B6355}
  .tag{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
    background:var(--soft);border:1px solid var(--line);border-radius:20px;
    padding:2px 9px;margin-right:6px;color:var(--accent);font-family:system-ui,sans-serif}
  .passage{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px}
  .passage p{margin:0 0 13px;position:relative;padding-left:34px}
  .ln{position:absolute;left:0;top:2px;font:11px/1 system-ui,sans-serif;color:#9A9284}
  .gist{background:var(--soft);border:1px solid var(--accent);border-radius:10px;
    padding:14px 16px;margin:18px 0}
  .gist textarea{width:100%;min-height:56px;font:15px/1.5 Georgia,serif;padding:9px;
    border:1px solid var(--line);border-radius:6px;resize:vertical}
  .q{border-top:1px solid var(--line);padding:16px 0}
  .q:first-of-type{border-top:none}
  .qtext{font-weight:bold;margin-bottom:9px}
  label.opt{display:block;padding:8px 11px;margin:5px 0;border:1px solid var(--line);
    border-radius:7px;cursor:pointer;background:#fff}
  label.opt:hover{background:var(--soft)}
  label.opt input{margin-right:9px}
  label.opt.correct{border-color:var(--good);background:#EEF7F1}
  label.opt.chosen-wrong{border-color:var(--bad);background:#FBEFEF}
  .exp{font-size:14.5px;background:var(--soft);border-left:3px solid var(--accent);
    padding:10px 13px;margin-top:9px;border-radius:0 6px 6px 0}
  .shape{font:11px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;
    color:var(--bad);border:1px solid var(--bad);border-radius:20px;padding:2px 7px;margin-right:6px}
  .bar{position:sticky;top:0;background:var(--bg);padding:9px 0;z-index:9;
    border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;
    font:14px system-ui,sans-serif;flex-wrap:wrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:bold}
  .over{color:var(--bad)}
  .score{font-size:30px;font-weight:bold}
  .hide{display:none}
  .note{font-size:14px;color:#6B6355;font-style:italic}
  ul.compact{margin:6px 0;padding-left:20px}

  ul.compact li{margin:3px 0}
  .rpt-head{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
  .rpt-item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;
    background:#fff;page-break-inside:avoid;break-inside:avoid}
  .rpt-q{font-weight:bold;margin-bottom:7px}
  .rpt-row{font-size:14.5px;margin:3px 0}
  .rpt-row .lab{display:inline-block;min-width:104px;color:#6B6355;font:12px system-ui,sans-serif;
    text-transform:uppercase;letter-spacing:.04em}
  .rpt-wrong{color:var(--bad)}
  .rpt-right{color:var(--good)}
  .rpt-note{font-size:14px;background:var(--soft);border-left:3px solid var(--accent);
    padding:8px 11px;margin-top:8px;border-radius:0 5px 5px 0}
  .rpt-sec{margin-top:22px;font-size:19px;font-weight:bold;color:var(--ink);
    border-bottom:1px solid var(--line);padding-bottom:4px}
  .scorebar{display:flex;gap:18px;flex-wrap:wrap;font:14px system-ui,sans-serif;margin:10px 0}
  .scorebar div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 13px}
  .scorebar b{font-size:19px;display:block}
  @media print{
    body{background:#fff}
    .wrap{max-width:100%;padding:0}
    .bar, .noprint, button, header .sub{display:none !important}
    .rpt-item{border:1px solid #ccc}
    a{text-decoration:none;color:inherit}
    h1{font-size:20px}
  }
</style>
</head>

/* --- right-triangle diagram builder ---------------------------------- */
/* Always drawn with the right angle at the bottom-left. bl / tl / br are the
   vertex labels (blank for word problems). vertical / horizontal / hyp are the
   side labels; use "?" for the unknown side and it renders highlighted.      */
function triSVG(o){
  const BL=[70,170], TL=[70,55], BR=[290,170];
  const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];
  const unit=(p,q)=>{const dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy);return [dx/L,dy/L];};
  const acc='#7A4A1F', ink='#1A2B4A';
  const isQ=t=>String(t).indexOf('?')>=0;
  const sideCol=t=>isQ(t)?acc:ink;
  const sideW=t=>isQ(t)?3:2;

  // angle wedge at whichever vertex is marked
  const V = o.angleAt==='tl' ? TL : BR;
  const O1 = o.angleAt==='tl' ? BL : BL;
  const O2 = o.angleAt==='tl' ? BR : TL;
  const u1=unit(V,O1), u2=unit(V,O2);
  const R=30;
  const p1=[V[0]+u1[0]*R, V[1]+u1[1]*R];
  const p2=[V[0]+u2[0]*R, V[1]+u2[1]*R];
  let bx=u1[0]+u2[0], by=u1[1]+u2[1];
  const bl_=Math.hypot(bx,by)||1; bx/=bl_; by/=bl_;
  const ctrl=[V[0]+bx*R*1.14, V[1]+by*R*1.14];
  const atxt=[V[0]+bx*58, V[1]+by*58];

  const mV=mid(BL,TL), mH=mid(BL,BR), mHy=mid(TL,BR);

  return `<svg viewBox="0 0 360 215" width="100%" style="max-width:360px;display:block;margin:10px 0"
    xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif" font-size="15">
    <line x1="${BL[0]}" y1="${BL[1]}" x2="${TL[0]}" y2="${TL[1]}" stroke="${sideCol(o.vertical)}" stroke-width="${sideW(o.vertical)}"/>
    <line x1="${BL[0]}" y1="${BL[1]}" x2="${BR[0]}" y2="${BR[1]}" stroke="${sideCol(o.horizontal)}" stroke-width="${sideW(o.horizontal)}"/>

/* ==================== LaTeX EXPORT (all client-side) ==================== */
/* Builds a .tex file from the miss log and downloads it. Compiles with plain
   pdflatex \u2014 no packages beyond geometry/xcolor/parskip.                  */

const SUP = {'\u2070':'0','\u00B9':'1','\u00B2':'2','\u00B3':'3','\u2074':'4','\u2075':'5',
             '\u2076':'6','\u2077':'7','\u2078':'8','\u2079':'9','\u207A':'+','\u207B':'-',
             '\u207F':'n','\u1D50':'m','\u1D4F':'k','\u1D56':'p','\u146B':'q'};

const UNI = {
  '\u00D7':'\u0001M\u0001\\times\u0001M\u0001', '\u2212':'\u0001M\u0001-\u0001M\u0001',
  '\u00F7':'\u0001M\u0001\\div\u0001M\u0001', '\u03C0':'\u0001M\u0001\\pi\u0001M\u0001',
  '\u2248':'\u0001M\u0001\\approx\u0001M\u0001', '\u2260':'\u0001M\u0001\\neq\u0001M\u0001',
  '\u2264':'\u0001M\u0001\\leq\u0001M\u0001', '\u2265':'\u0001M\u0001\\geq\u0001M\u0001',
  '\u00B0':'\\textdegree{}', '\u25B3':'\u0001M\u0001\\triangle\u0001M\u0001',
  '\u2014':'---', '\u2013':'--', '\u00B7':'\u0001M\u0001\\cdot\u0001M\u0001',
  '\u2018':"`", '\u2019':"'", '\u201C':"``", '\u201D':"''", '\u2026':'\\ldots{}',
  '\u00A0':' ', '\u2192':'\u0001M\u0001\\rightarrow\u0001M\u0001',
  '\u2190':'\u0001M\u0001\\leftarrow\u0001M\u0001'
};

/* Turn "A / B" into \frac{A}{B}, for the LaTeX export only — the on-screen app
   keeps the slash. An operand is either a balanced (...) group, whose outer
   parentheses the fraction bar makes redundant, or a run of non-space
   characters. "sin 58" and friends are held together, and a trailing full stop
   is left outside so "1/6." does not become \frac{1}{6.}. Both sides are marked
   with placeholders here so the escaper still processes their text normally. */
const FRAC_FN = /^(sin|cos|tan|log|ln)$/i;
function markFracs(t){
  const atom = c => c !== undefined && /[^\s()\/=+<>,;:]/.test(c);
  let out = '', i = 0;
  while(i < t.length){
    if(t[i] !== '/'){ out += t[i++]; continue; }

    // numerator: walk backwards through what has already been emitted
    let lEnd = out.length;
    while(lEnd > 0 && out[lEnd-1] === ' ') lEnd--;
    let lStart, lParen = false;
    if(lEnd > 0 && out[lEnd-1] === ')'){
      let d = 0, k = lEnd;
      while(k > 0){ k--; if(out[k] === ')') d++; else if(out[k] === '('){ d--; if(!d) break; } }
      if(d !== 0){ out += t[i++]; continue; }
      lStart = k; lParen = true;
    } else {
      let k = lEnd;
      while(k > 0 && atom(out[k-1])) k--;
      lStart = k;
    }
    let num = out.slice(lStart, lEnd);
    if(lParen) num = num.slice(1,-1);

    // denominator: walk forwards through the rest of the string
    let m = i + 1;
    while(m < t.length && t[m] === ' ') m++;
    let rStart = m, rEnd, rParen = false;
    if(t[m] === '('){
      let d = 0, n = m;
      for(; n < t.length; n++){
        if(t[n] === '(') d++;
        else if(t[n] === ')'){ d--; if(!d){ n++; break; } }
      }
      if(d !== 0){ out += t[i++]; continue; }
      rEnd = n; rParen = true;
    } else {
      let n = m;
      while(n < t.length && atom(t[n])) n++;
      if(FRAC_FN.test(t.slice(m,n))){            // keep "sin 58" as one operand
        let p = n;
        while(p < t.length && t[p] === ' ') p++;
        while(p < t.length && atom(t[p])) p++;
        n = p;
      }
      rEnd = n;
    }
    let den = t.slice(rStart, rEnd);
    if(rParen) den = den.slice(1,-1);
    else {
      const tail = den.match(/[.,;:!?]+$/);
      if(tail){ den = den.slice(0, -tail[0].length); rEnd -= tail[0].length; }
    }

    // only numeric-looking pairs become fractions, so "and/or" is left alone
    if(!num || !den || !(/\d/.test(num) || /\d/.test(den))){ out += t[i++]; continue; }
    out = out.slice(0, lStart) + '\u0001F\u0001' + num + '\u0001D\u0001' + den + '\u0001G\u0001';
    i = rEnd;
  }
  return out;
}

function texEscape(str){
  let t = String(str);

  // 1. decode entities to real characters first
  t = t.replace(/&mdash;/g,'\u2014').replace(/&ndash;/g,'\u2013')
       .replace(/&nbsp;/g,' ').replace(/&rarr;/g,'\u2192').replace(/&larr;/g,'\u2190')
       .replace(/&middot;/g,'\u00B7').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
       .replace(/&amp;/g,'&');

  // 2. HTML tags -> placeholders the escaper will not touch
  t = t.replace(/<br\s*\/?>/gi, '\u0001BR\u0001')
       .replace(/<b>/gi,'\u0001BS\u0001').replace(/<\/b>/gi,'\u0001BE\u0001')
       .replace(/<i>/gi,'\u0001IS\u0001').replace(/<\/i>/gi,'\u0001IE\u0001')
       .replace(/<sup>/gi,'\u0001SS\u0001').replace(/<\/sup>/gi,'\u0001SE\u0001')
       .replace(/<[^>]+>/g,'');

  t = markFracs(t);

  // 3. escape LaTeX specials on plain text
  t = t.replace(/\\/g,'\u0001TB\u0001')
       .replace(/([&%#_{}$])/g, '\\$1')
       .replace(/\^/g,'\\textasciicircum{}')
       .replace(/~/g,'\\textasciitilde{}');

  // 4. superscript runs -> one \textsuperscript{}
  const supRe = new RegExp('[' + Object.keys(SUP).join('') + ']+', 'g');
  t = t.replace(supRe, m => '\u0001SS\u0001' + Array.from(m).map(c=>SUP[c]).join('') + '\u0001SE\u0001');

  // 5. maths-y unicode
  t = t.replace(/\u221A\s*([A-Za-z0-9]+)/g, (m,x)=>'\u0001M\u0001\\sqrt{'+x+'}\u0001M\u0001');
  t = t.replace(/\u221A/g,'\u0001M\u0001\\surd\u0001M\u0001');
  Object.keys(UNI).forEach(c=>{ t = t.split(c).join(UNI[c]); });

  // 6. anything still non-ASCII is dropped rather than breaking the build
  t = t.replace(/[^\x00-\x7F\u0001]/g,'');

  // 7. placeholders -> real LaTeX
  t = t.replace(/\u0001BR\u0001/g,'\\par ')
       .replace(/\u0001BS\u0001/g,'{\\bfseries ').replace(/\u0001BE\u0001/g,'}')
       .replace(/\u0001IS\u0001/g,'{\\itshape ').replace(/\u0001IE\u0001/g,'}')
       .replace(/\u0001SS\u0001/g,'\\textsuperscript{').replace(/\u0001SE\u0001/g,'}')
       .replace(/\u0001TB\u0001/g,'\\textbackslash{}')
       .replace(/\u0001M\u0001/g,'$')
       .replace(/\u0001F\u0001/g,'$\\frac{\\text{')
       .replace(/\u0001D\u0001/g,'}}{\\text{')
       .replace(/\u0001G\u0001/g,'}}$');
  return t;
}

function buildTex(){
  const log = load('misslog', []);
  const d = new Date();
  const date = d.toLocaleDateString('en-GB',{day:'numeric', month:'long', year:'numeric'});

  const bySet = {};
  log.forEach(e=>{ (bySet[e.setTitle] = bySet[e.setTitle] || []).push(e); });

  let out = [];
  out.push('\\documentclass[11pt]{article}');
  out.push('\\usepackage[margin=0.9in]{geometry}');
  out.push('\\usepackage{amsmath}\\usepackage{xcolor}\\usepackage{parskip}');
  out.push('\\definecolor{ink}{HTML}{1A2B4A}\\definecolor{bad}{HTML}{A32B2B}\\definecolor{good}{HTML}{1E7A4A}\\definecolor{acc}{HTML}{7A4A1F}');
  out.push('\\newcommand{\\lab}[1]{{\\footnotesize\\textsc{\\textcolor{acc}{#1}}}\\quad}');
  out.push('\\begin{document}');
  out.push('\\begin{center}{\\Large\\bfseries\\textcolor{ink}{ISEE Review Sheet}}\\\\[2pt]{\\small ' + texEscape(date) + '}\\end{center}');
  out.push('\\hrule\\vspace{10pt}');

  if(log.length === 0){
    out.push('Nothing logged yet.');
  } else {
    out.push('{\\small ' + log.length + ' question' + (log.length===1?'':'s') + ' missed. For each one, read the explanation, then write in your own words what you would do differently.}\\vspace{6pt}');
    Object.keys(bySet).forEach(setTitle=>{
      out.push('\\par\\vspace{12pt}\\noindent{\\large\\bfseries\\textcolor{ink}{' + texEscape(setTitle) + '}}\\par');
      out.push('\\vspace{2pt}\\hrule\\vspace{8pt}');
      bySet[setTitle].forEach(e=>{
        out.push('\\noindent{\\bfseries ' + texEscape(e.question) + '}\\par\\vspace{3pt}');
        if(e.gist) out.push('\\noindent\\lab{Your gist}\\textit{' + texEscape(e.gist) + '}\\par');
        out.push('\\noindent\\lab{You chose}\\textcolor{bad}{' + texEscape(e.chosen) + '}\\par');
        out.push('\\noindent\\lab{Answer}\\textcolor{good}{' + texEscape(e.correct) + '}\\par');
        if(e.shape) out.push('\\noindent\\lab{Failure shape}' + texEscape(e.shape) + '\\par');
        if(e.type)  out.push('\\noindent\\lab{Type}' + texEscape(e.type) + '\\par');
        out.push('\\vspace{3pt}\\noindent\\fbox{\\parbox{0.96\\textwidth}{\\small ' + texEscape(e.explanation) + '}}\\par');
        out.push('\\vspace{4pt}\\noindent\\lab{What I would do differently}\\rule{0.55\\textwidth}{0.4pt}\\par');
        out.push('\\vspace{12pt}');
      });
    });
  }
  out.push('\\end{document}');
  return out.join('\n');
}

window.downloadTex = function(){
  const blob = new Blob([buildTex()], {type:'application/x-tex'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = 'isee-review-' + stamp + '.tex';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 0);
};

/* ==================== MISS LOG / TEST MODE / REPORT ==================== */

function logMisses(entries){
  const log = load('misslog', []);
  entries.forEach(e=>log.push(e));
  // keep the most recent 200 so storage never fills
  save('misslog', log.slice(-200));
}

let TESTMODE = false;
let TESTQUEUE = [];
let TESTSTART = 0;

window.startFullTest = function(kind){
  TESTMODE = true;
  TESTSTART = Date.now();
  save('misslog', []);            // a fresh session starts a fresh report
  TESTQUEUE = (kind === 'math')
    ? MATHSETS.map(m=>({type:'math', id:m.id}))
    : PASSAGES.map(p=>({type:'passage', id:p.id})).concat(MATHSETS.map(m=>({type:'math', id:m.id})));
  nextInTest();
};

function nextInTest(){
  if(TESTQUEUE.length === 0){ TESTMODE = false; go('report'); return; }
  const item = TESTQUEUE.shift();
  window.scrollTo(0,0);
  if(item.type === 'passage') passageView(item.id); else mathView(item.id);
}

function reportView(){
  stopTimer();
  const log = load('misslog', []);
  const bySet = {};
  log.forEach(e=>{ (bySet[e.setTitle] = bySet[e.setTitle] || []).push(e); });

  const totalMissed = log.length;
  const totalAsked  = log.length ? log[0].sessionTotal || 0 : 0;

  let h = `<div class="bar noprint">
      <button onclick="go('home')">&larr; Back</button>
      <button class="primary" onclick="window.print()">Print / Save as PDF</button>
      <button onclick="downloadTex()">Download .tex</button>
      <button onclick="clearReport()">Clear</button>
    </div>`;

  h += `<div class="rpt-head">
    <h2 style="margin:0">Review sheet</h2>
    <div class="meta">Generated ${new Date().toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long', year:'numeric'})}</div>
  </div>`;

  if(totalMissed === 0){
    h += `<div class="card"><p>Nothing logged yet. Work through a set, or run a full session from the home screen, and every question you miss lands here.</p></div>`;
    app.innerHTML = h; return;
  }

  // score strip
  const scores = load('scores',{});
  h += `<div class="scorebar">`;
  Object.keys(bySet).forEach(k=>{
    const n = bySet[k].length;
    h += `<div>${k}<b>${n} missed</b></div>`;
  });
  h += `</div>`;

  h += `<p class="note">One card per question missed. The explanation is on each card &mdash; read it, then say out loud what you would do differently. That sentence is the part that sticks.</p>`;

  Object.keys(bySet).forEach(setTitle=>{
    h += `<div class="rpt-sec">${setTitle}</div>`;
    bySet[setTitle].forEach(e=>{
      h += `<div class="rpt-item">
        <div class="rpt-q">${e.question}</div>
        ${e.gist ? `<div class="rpt-row"><span class="lab">Your gist</span><i>${e.gist}</i></div>` : ''}
        <div class="rpt-row"><span class="lab">You chose</span><span class="rpt-wrong">${e.chosen}</span></div>
        <div class="rpt-row"><span class="lab">Answer</span><span class="rpt-right">${e.correct}</span></div>
        ${e.shape ? `<div class="rpt-row"><span class="lab">Failure shape</span>${e.shape}</div>` : ''}
        ${e.type ? `<div class="rpt-row"><span class="lab">Question type</span>${e.type}</div>` : ''}
        <div class="rpt-note">${e.explanation}</div>
        <div class="rpt-row" style="margin-top:9px"><span class="lab">What I'd do differently</span>
          <span style="display:inline-block;border-bottom:1px solid var(--line);min-width:58%">&nbsp;</span></div>
      </div>`;
    });
  });

  app.innerHTML = h;
}

window.clearReport = function(){ save('misslog', []); go('report'); };

/* ============================ STATE ============================ */
const app = document.getElementById('app');
let view = {name:'home'};
let timerId = null, elapsed = 0;

function save(k,v){ try{ localStorage.setItem('isee:'+k, JSON.stringify(v)); }catch(e){} }
function load(k,d){ try{ const v=localStorage.getItem('isee:'+k); return v?JSON.parse(v):d; }catch(e){ return d; } }

function fmt(s){ const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }

function startTimer(target){
  elapsed=0; clearInterval(timerId);
  timerId=setInterval(()=>{ elapsed++; const el=document.getElementById('timer');
    if(el){ el.textContent=fmt(elapsed); el.className='timer'+(elapsed>target?' over':''); } },1000);
}
function stopTimer(){ clearInterval(timerId); timerId=null; }

/* ============================ VIEWS ============================ */

function home(){
  stopTimer();
  const scores = load('scores',{});
  const nMiss = load('misslog',[]).length;
  let h = `<h2>Run a full session</h2>
    <div class="card">
      <p class="meta" style="margin:0 0 10px">No answers shown until the end. Every question missed goes onto a review sheet you can print.</p>
      <button class="primary" onclick="startFullTest('math')">Math only &mdash; 29 questions</button>
      <button onclick="startFullTest('all')" style="margin-left:8px">Everything &mdash; 4 passages + 29 questions</button>
    </div>
    <div class="card">
      <h3 style="margin:0 0 4px">Review sheet</h3>
      <div class="meta">${nMiss? nMiss+' question'+(nMiss===1?'':'s')+' logged' : 'nothing logged yet'}</div>
      <button class="primary" style="margin-top:10px" onclick="go('report')">Open &amp; print</button>
    </div>
    <p class="note">Read the passage, write the one-sentence gist, then answer. The gist is the whole point &mdash; when it is vague, the inference questions are the ones that fall.</p><h2>Reading</h2>`;
  PASSAGES.forEach(p=>{
    const s = scores[p.id];
    const inf = p.questions.filter(q=>q.t==="Inference").length;
    h += `<div class="card"><h3>${p.title}</h3>
      <div class="meta"><span class="tag">${p.genre}</span>${p.questions.length} questions &middot; ${inf} inference &middot; target ${fmt(p.target)}</div>
      <p class="meta" style="margin:8px 0">${s? 'Last score: <b>'+s.c+' / '+s.t+'</b> in '+fmt(s.time) : '&nbsp;'}</p>
      <button class="primary" onclick="go('passage','${p.id}')">${s?'Try again':'Start'}</button></div>`;
  });
  h += `<h2>Math</h2>`;
  MATHSETS.forEach(m=>{
    const ms = scores[m.id];
    h += `<div class="card"><h3>${m.title}</h3>
      <div class="meta"><span class="tag">${m.tag}</span>${m.questions.length} questions</div>
      <p class="meta" style="margin:8px 0">${ms? 'Last score: <b>'+ms.c+' / '+ms.t+'</b>' : '&nbsp;'}</p>
      <button class="primary" onclick="go('math','${m.id}')">${ms?'Try again':'Start'}</button></div>`;
  });
  h += `<p class="note" style="margin-top:26px">Read the explanation on every one you miss, not just the score.</p>`;
  app.innerHTML = h;
}

function passageView(id){
  const p = PASSAGES.find(x=>x.id===id);
  let h = `<div class="bar"><button onclick="go('home')">&larr; Back</button>
     <span>Target ${fmt(p.target)}</span><span class="timer" id="timer">0:00</span></div>
     <h2>${p.title}</h2><div class="meta" style="margin-bottom:10px"><span class="tag">${p.genre}</span></div>
     <div class="passage">`;
  p.paras.forEach(([n,t])=>{ h += `<p><span class="ln">${n}</span>${t}</p>`; });
  h += `</div>
    <div class="gist"><b>Before you look at a single question:</b><br>
    In one sentence, what is this passage about? If you cannot write it, reread.
    <textarea id="gistbox" placeholder="This passage is about..."></textarea>
    <button class="primary" style="margin-top:8px" onclick="unlock('${p.id}')">Lock it in &amp; show questions</button>
    <div id="gistwarn" class="note"></div></div>
    <div id="questions" class="hide"></div>`;
  app.innerHTML = h;
  startTimer(p.target);
}

window.unlock = function(id){
  const g = document.getElementById('gistbox').value.trim();
  if(g.split(/\s+/).filter(Boolean).length < 5){
    document.getElementById('gistwarn').innerHTML = 'Write a real sentence first &mdash; at least five words. This step is the practice.';
    return;
  }
  const p = PASSAGES.find(x=>x.id===id);
  let h = '<div class="card">';
  p.questions.forEach((q,i)=>{
    h += `<div class="q" id="q${i}"><div class="qtext">${i+1}. ${q.q}</div>
      <div class="meta" style="margin-bottom:6px"><span class="tag">${q.t}</span></div>`;
    q.o.forEach((o,j)=>{
      h += `<label class="opt" id="o${i}_${j}"><input type="radio" name="q${i}" value="${j}">${o}</label>`;
    });
    h += `<div class="exp hide" id="e${i}"></div></div>`;
  });
  h += `<button class="primary" style="margin-top:14px" onclick="grade('${id}')">Submit answers</button></div>`;
  const box = document.getElementById('questions');
  box.innerHTML = h; box.classList.remove('hide');
  box.scrollIntoView({behavior:'smooth'});
};

window.grade = function(id){
  stopTimer();
  const p = PASSAGES.find(x=>x.id===id);
  let c = 0;
  p.questions.forEach((q,i)=>{
    const sel = document.querySelector(`input[name="q${i}"]:checked`);
    const pick = sel ? +sel.value : -1;
    if(pick === q.a) c++;
    document.getElementById(`o${i}_${q.a}`).classList.add('correct');
    if(pick !== -1 && pick !== q.a) document.getElementById(`o${i}_${pick}`).classList.add('chosen-wrong');
    const e = document.getElementById(`e${i}`);
    let shape = '';
    if(pick !== -1 && pick !== q.a && q.w && q.w[pick]){
      const s = SHAPES[q.w[pick]];
      shape = `<span class="shape">${s[0]}</span> ${s[1]}<br><br>`;
    }
    if(!TESTMODE){ e.innerHTML = shape + q.e; e.classList.remove('hide'); }
    document.querySelectorAll(`input[name="q${i}"]`).forEach(r=>r.disabled=true);

  });
  const infTot = p.questions.filter(q=>q.t==="Inference").length;
  let infC = 0;
  p.questions.forEach((q,i)=>{ if(q.t==="Inference"){ const s=document.querySelector(`input[name="q${i}"]:checked`); if(s && +s.value===q.a) infC++; } });

  const scores = load('scores',{}); scores[id]={c:c,t:p.questions.length,time:elapsed}; save('scores',scores);
  const yours = document.getElementById('gistbox').value.trim();

  const missed = [];
  p.questions.forEach((q,i)=>{
    const sel = document.querySelector(`input[name="q${i}"]:checked`);
    const pick = sel ? +sel.value : -1;
    if(pick === q.a) return;
    missed.push({
      setTitle: p.title + ' (' + p.genre + ')',
      question: (i+1) + '. ' + q.q,
      chosen: pick === -1 ? 'left blank' : q.o[pick],
      correct: q.o[q.a],
      explanation: q.e,
      type: q.t,
      shape: (pick !== -1 && q.w && q.w[pick]) ? SHAPES[q.w[pick]][0] + ' \u2014 ' + SHAPES[q.w[pick]][1] : '',
      gist: yours,
      sessionTotal: p.questions.length
    });
  });
  logMisses(missed);

  if(TESTMODE){ nextInTest(); return; }

  const banner = document.createElement('div');
  banner.className='card';
  banner.innerHTML = `<div class="score">${c} / ${p.questions.length}</div>
    <div class="meta">Inference: <b>${infC} / ${infTot}</b> &middot; Time ${fmt(elapsed)} (target ${fmt(p.target)})</div>
    <div style="margin-top:14px"><b>Your gist:</b><br><i>${yours.replace(/</g,'&lt;')}</i></div>
    <div style="margin-top:10px"><b>A good gist:</b><br><i>${p.gist}</i></div>
    <div class="exp" style="margin-top:14px">${c < p.questions.length-1
      ? 'Compare the two sentences above. When a passage goes badly, the gist is almost always the thing that was vague &mdash; and inference questions are the first to fall, because they are the only ones you cannot answer by looking something up.'
      : 'Well done. Notice how much of that came from having the passage clear before the first question.'}</div>
    <button class="primary" style="margin-top:14px" onclick="go('home')">Back to list</button>`;
  document.getElementById('questions').prepend(banner);
  banner.scrollIntoView({behavior:'smooth'});
};

function mathView(id){
  const m = MATHSETS.find(x=>x.id===id);
  window.__MSET = m;
  let h = `<div class="bar"><button onclick="go('home')">&larr; Back</button><span class="timer" id="timer">0:00</span></div>
    <h2>${m.title}</h2><div class="exp">${m.intro}</div><div class="card">`;
  m.questions.forEach((q,i)=>{
    h += `<div class="q"><div class="qtext">${i+1}. ${q.q}</div>`;
    if(q.svg) h += triSVG(q.svg);
    q.o.forEach((o,j)=>{ h += `<label class="opt" id="mo${i}_${j}"><input type="radio" name="m${i}" value="${j}">${o}</label>`; });
    h += `<div class="exp hide" id="me${i}"></div></div>`;
  });
  h += `<button class="primary" style="margin-top:14px" onclick="gradeMath()">Submit answers</button></div>`;
  app.innerHTML = h;
  startTimer(m.target);
}

window.gradeMath = function(){
  stopTimer();
  const M = window.__MSET;
  let c=0;
  M.questions.forEach((q,i)=>{
    const sel = document.querySelector(`input[name="m${i}"]:checked`);
    const pick = sel? +sel.value : -1;
    if(pick===q.a) c++;
    document.getElementById(`mo${i}_${q.a}`).classList.add('correct');
    if(pick!==-1 && pick!==q.a) document.getElementById(`mo${i}_${pick}`).classList.add('chosen-wrong');
    const e=document.getElementById(`me${i}`);
    if(!TESTMODE){ e.innerHTML=q.e; e.classList.remove('hide'); }
    document.querySelectorAll(`input[name="m${i}"]`).forEach(r=>r.disabled=true);
  });
  const scores=load('scores',{}); scores[M.id]={c:c,t:M.questions.length,time:elapsed}; save('scores',scores);

  const missedM=[];
  M.questions.forEach((q,i)=>{
    const sel=document.querySelector(`input[name="m${i}"]:checked`);
    const pick=sel? +sel.value : -1;
    if(pick===q.a) return;
    missedM.push({
      setTitle: M.title,
      question: (i+1)+'. '+q.q,
      chosen: pick===-1 ? 'left blank' : q.o[pick],
      correct: q.o[q.a],
      explanation: q.e,
      type: M.tag,
      shape: '',
      sessionTotal: M.questions.length
    });
  });
  logMisses(missedM);
  if(TESTMODE){ nextInTest(); return; }
  const b=document.createElement('div'); b.className='card';
  const TIPS = {
    chain:'On any you missed, check whether your answer was actually <i>wrong</i> or just <i>unfinished</i>. Stopping one step early is the thing to watch for.',
    sci:  'On any you missed, check whether the front number ended between 1 and 10 \u2014 and on the rate questions, whether the units actually cancelled.',
    cbd:  'On any you missed, ask how many cases you tested before answering. One is never enough.',
    trig: 'On any you missed, check which of the two decisions failed: naming the sides, or multiply-versus-divide. It is almost always the second.'
  };
  const tip = TIPS[M.id] || 'Read the explanation on every one you missed.';
  b.innerHTML=`<div class="score">${c} / ${M.questions.length}</div>
    <div class="meta">Time ${fmt(elapsed)}</div>
    <div class="exp" style="margin-top:12px">${tip}</div>
    <button class="primary" style="margin-top:12px" onclick="go('home')">Back to list</button>`;
  app.querySelector('.card').prepend(b);
  b.scrollIntoView({behavior:'smooth'});
};

window.go = function(name, id){
  window.scrollTo(0,0);
  if(name==='home') home();
  else if(name==='passage') passageView(id);
  else if(name==='math') mathView(id);
  else if(name==='report') reportView();
};

home();
</script>
